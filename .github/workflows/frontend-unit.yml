name: Frontend Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test-frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    name: Vitest unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        # --ignore-scripts: skip dependency lifecycle scripts (supply-chain hardening).
        # Safe here: Vitest ships prebuilt and needs no script-installed binaries.
        run: yarn --frozen-lockfile --silent --ignore-scripts

      - name: Type check tests
        run: yarn type-check:test

      - name: Run unit tests
        run: yarn test
